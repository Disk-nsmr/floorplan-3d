<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>間取り3Dメーカー</title>
<style>
  :root{
    --bg:#e9edf1; --surface:#ffffff; --surface2:#f5f7f9; --text:#1c232b; --sub:#5a6672; --line:#d3d9df;
    --accent:#c9721f; --accent-ink:#fff; --accent-soft:#fbeedd; --sel:#1f6feb; --danger:#b83a30;
    --ok-bg:#e3f3e8; --ok:#23713f; --err-bg:#f9e4e2; --err:#a8342b;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12171d; --surface:#1b2128; --surface2:#222a32; --text:#e8edf1; --sub:#9aa6b2; --line:#2e3842;
      --accent:#f0a14a; --accent-ink:#1a1a1a; --accent-soft:#3a2a17; --sel:#5b9cff; --danger:#e0655b;
      --ok-bg:#1d3a28; --ok:#8fdcaa; --err-bg:#402220; --err:#ff9d94;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.55 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  button,select,input{font:inherit;color:inherit}
  button{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:32px}
  button:hover{filter:brightness(.97)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
  button.danger{color:var(--danger)}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input[type=text],input[type=number],input[type=password],select{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;width:100%}
  [hidden]{display:none!important}

  header{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header .brand{font-weight:800;font-size:15px;white-space:nowrap}
  header .brand a{color:var(--sub);text-decoration:none;font-weight:600;font-size:12px;margin-right:6px}
  header #title{max-width:240px}
  header .grow{flex:1}
  header .save{font-size:12px;color:var(--sub);white-space:nowrap}

  .main{display:grid;grid-template-columns:200px 1fr 270px;min-height:0}
  .rail{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:10px;display:grid;gap:4px;align-content:start}
  .step{font-size:11px;letter-spacing:.06em;color:var(--sub);margin:10px 2px 2px;display:flex;gap:6px;align-items:center}
  .step b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--line);color:var(--text);font-size:11px}
  .step.done b{background:var(--ok);color:#fff}
  .tool{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border-color:transparent;padding:6px 8px}
  .tool:hover{background:var(--surface2)}
  .tool.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
  .tool kbd{margin-left:auto;font-size:10px;color:var(--sub);font-family:inherit}
  .opt{display:flex;gap:6px;align-items:center;padding:2px 8px;font-size:12px;color:var(--sub)}
  .opt select{width:auto;padding:2px 6px}

  .stage{position:relative;min-width:0;min-height:0;background:repeating-conic-gradient(var(--surface2) 0 25%, var(--bg) 0 50%) 0 0/24px 24px}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:calc(100% - 24px);text-align:center;pointer-events:none}
  .zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
  .zoom button{min-width:34px;background:var(--surface)}

  .side{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:12px;display:grid;gap:12px;align-content:start}
  .side h3{margin:0;font-size:14px}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .row > *{flex:1}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-variant-numeric:tabular-nums}
  .kv dt{color:var(--sub)}
  .kv dd{margin:0}
  label.f{display:grid;gap:3px;font-size:12px;color:var(--sub)}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chips button{min-height:26px;padding:2px 8px;font-size:12px}
  .muted{color:var(--sub);font-size:12px}
  .msg{border-radius:8px;padding:8px 10px;font-size:12px}
  .msg.ok{background:var(--ok-bg);color:var(--ok)}
  .msg.err{background:var(--err-bg);color:var(--err)}

  /* 開始画面・ダイアログ */
  .overlay{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);display:grid;place-items:center;padding:16px;overflow:auto}
  .dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(560px,100%);display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
  .dialog h2{margin:0;font-size:20px}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;display:grid;gap:8px;cursor:pointer}
  .drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .drop b{font-size:15px}
  .list{display:grid;gap:6px}
  .list .item{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .list .item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:7px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
  #viewer{position:fixed;inset:0;z-index:50}

  @media (max-width:900px){
    .main{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
    .rail{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:6px}
    .step{display:none}
    .tool{width:auto;white-space:nowrap}
    .tool kbd,.opt{display:none}
    .side{border-left:0;border-top:1px solid var(--line);max-height:38vh}
  }
</style>
</head>
<body>
<header>
  <span class="brand"><a href="./">‹ 一覧</a>間取り3Dメーカー</span>
  <input type="text" id="title" placeholder="間取りの名前（例：洋8.2帖 1K）" aria-label="間取りの名前">
  <span class="grow"></span>
  <span class="save" id="saveState"></span>
  <button id="undo" title="元に戻す（Ctrl+Z）">↶ 戻す</button>
  <button id="redo" title="やり直す（Ctrl+Shift+Z）">↷</button>
  <button id="openMenu">ファイル</button>
  <button id="publishBtn">サイトに公開</button>
  <button class="primary" id="view3d">3Dで見る</button>
</header>

<div class="main">
  <nav class="rail" id="rail">
    <button class="tool" data-tool="select">選択・移動<kbd>V</kbd></button>
    <div class="step" id="st1"><b>1</b>縮尺を合わせる</div>
    <button class="tool" data-tool="scale">帖数で合わせる<kbd>K</kbd></button>
    <button class="tool" data-tool="scaleLen">長さで合わせる</button>
    <div class="step" id="st2"><b>2</b>壁をなぞる</div>
    <button class="tool" data-tool="wall">壁（線）<kbd>W</kbd></button>
    <button class="tool" data-tool="wallRect">壁（四角）<kbd>Q</kbd></button>
    <label class="opt"><input type="checkbox" id="ortho" checked> 水平・垂直にそろえる</label>
    <label class="opt">厚さ <select id="wallT"><option value="0.1">10cm</option><option value="0.12" selected>12cm</option><option value="0.15">15cm</option><option value="0.18">18cm</option></select></label>
    <label class="opt">高さ <select id="wallH"><option value="full" selected>天井まで</option><option value="low">腰壁（1.1m）</option></select></label>
    <div class="step" id="st3"><b>3</b>ドア・窓を置く</div>
    <button class="tool" data-tool="door">ドア<kbd>D</kbd></button>
    <button class="tool" data-tool="slide">掃き出し窓<kbd>S</kbd></button>
    <button class="tool" data-tool="window">窓<kbd>N</kbd></button>
    <button class="tool" data-tool="opening">開口（扉なし）<kbd>O</kbd></button>
    <div class="step" id="st4"><b>4</b>部屋を囲む</div>
    <button class="tool" data-tool="room">部屋<kbd>R</kbd></button>
    <div class="step" id="st5"><b>5</b>設備・家具</div>
    <button class="tool" data-tool="item">設備を置く<kbd>F</kbd></button>
    <label class="opt"><select id="itemType">
      <option value="kitchen">キッチン</option><option value="tub">浴槽</option><option value="basin">洗面台</option>
      <option value="toilet">トイレ</option><option value="washer">洗濯機</option><option value="fridge">冷蔵庫</option>
      <option value="shelf">収納・棚</option><option value="bed">ベッド</option><option value="sofa">ソファ</option>
      <option value="table">テーブル</option><option value="tv">テレビ台</option><option value="rug">ラグ</option>
    </select></label>
    <div class="step" id="st6"><b>6</b>立つ位置</div>
    <button class="tool" data-tool="start">最初に立つ位置</button>
  </nav>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"></div>
    <div class="zoom"><button id="zIn" title="拡大">＋</button><button id="zOut" title="縮小">－</button><button id="zFit" title="全体を表示">全体</button></div>
  </div>

  <aside class="side" id="side"></aside>
</div>

<!-- 開始画面 -->
<div class="overlay" id="startScreen" hidden>
  <div class="dialog">
    <h2>間取り図から3Dを作る</h2>
    <p class="muted">図面の画像を読み込み、壁やドアをなぞると、人の目線で歩ける3Dができます。作業中の内容はこのブラウザに自動で保存されます。</p>
    <label class="drop" id="drop" for="imgFile">
      <b>図面の画像を選ぶ</b>
      <span class="muted">ここに画像をドラッグしても読み込めます（PNG・JPEG）</span>
    </label>
    <input type="file" id="imgFile" accept="image/*" hidden>
    <div id="draftsWrap" hidden>
      <div class="muted" style="margin-bottom:6px">このブラウザに保存されている作業</div>
      <div class="list" id="drafts"></div>
    </div>
    <div class="row"><button id="importBtn">ファイルから読み込む</button></div>
  </div>
</div>

<!-- ファイルメニュー -->
<div class="overlay" id="fileMenu" hidden>
  <div class="dialog">
    <h2>ファイル</h2>
    <div class="list">
      <button id="exportBtn">ファイルに書き出す（.json）</button>
      <button id="importBtn2">ファイルから読み込む</button>
      <button id="replaceImg">図面の画像を差し替える</button>
      <button id="newBtn">新しい間取りを始める</button>
    </div>
    <div class="row"><button id="closeMenu">閉じる</button></div>
  </div>
</div>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>
<input type="file" id="imgFile2" accept="image/*" hidden>

<!-- 公開ダイアログ -->
<div class="overlay" id="pubDialog" hidden>
  <div class="dialog">
    <h2>サイトに公開</h2>
    <p class="muted">一覧ページに追加して、誰でも見られるようにします。公開できるのは、サイトの GitHub リポジトリに書き込める管理者だけです。</p>
    <label class="f">間取りの名前<input type="text" id="pubTitle" placeholder="例：洋8.2帖 1K"></label>
    <label class="f">ひとこと説明（一覧に表示）<input type="text" id="pubSummary" placeholder="例：南向きバルコニー付きの1K"></label>
    <div id="pubTokenWrap">
      <label class="f">アクセストークン（管理者ページと同じもの）<input type="password" id="pubToken" autocomplete="off" placeholder="github_pat_…"></label>
      <label class="opt" style="padding:4px 0"><input type="checkbox" id="pubRemember"> このブラウザに記憶する</label>
    </div>
    <div class="msg" id="pubMsg" hidden></div>
    <div class="row"><button id="pubCancel">閉じる</button><button class="primary" id="pubGo">公開する</button></div>
  </div>
</div>

<div id="viewer" hidden></div>
<div class="toast" id="toast"></div>

<script src="three.min.js"></script>
<script src="walk3d.js"></script>
<script>
(() => {
'use strict';
const OWNER = 'Disk-nsmr', REPO = 'floorplan-3d', BRANCH = 'main';
const TOKEN_KEY = 'floorplan-admin-token';
const JO = 1.62;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ITEM_NAMES = { kitchen: 'キッチン', tub: '浴槽', basin: '洗面台', toilet: 'トイレ', washer: '洗濯機', fridge: '冷蔵庫', shelf: '収納・棚', bed: 'ベッド', sofa: 'ソファ', table: 'テーブル', tv: 'テレビ台', rug: 'ラグ' };
const ITEM_SIZE = { kitchen: [2.4, 0.65], tub: [1.2, 0.75], basin: [0.75, 0.55], toilet: [0.45, 0.75], washer: [0.64, 0.64], fridge: [0.65, 0.65], shelf: [0.9, 0.45], bed: [0.97, 1.95], sofa: [1.8, 0.85], table: [1.2, 0.75], tv: [1.5, 0.4], rug: [1.6, 1.6] };
const KIND_NAMES = { wood: 'フローリング', cf: 'クッションフロア', tatami: '畳', bath: '浴室のタイル', genkan: '玄関の土間（一段低い）', balcony: 'バルコニー（屋外・一段低い）' };
const KIND_COLOR = { wood: '#d9a05b', cf: '#9fb7c9', tatami: '#a7b46b', bath: '#7fb5d6', genkan: '#9a948a', balcony: '#8fa58a' };
const ROOM_PRESETS = [['洋室', 'wood'], ['LDK', 'wood'], ['キッチン', 'wood'], ['和室', 'tatami'], ['廊下', 'wood'], ['玄関', 'genkan'], ['浴室', 'bath'], ['洗面室', 'cf'], ['トイレ', 'cf'], ['収納', 'wood'], ['クローゼット', 'wood'], ['バルコニー', 'balcony']];
const OPEN_NAMES = { door: 'ドア', slide: '掃き出し窓', window: '窓', opening: '開口' };
const OPEN_W = { door: 0.78, slide: 1.7, window: 1.2, opening: 0.8 };

// ---------------- 状態 ----------------
let plan = null, img = null;
let tool = 'select', sel = null, hover = null;
let view = { s: 1, tx: 0, ty: 0 };
let draft = null;           // 作図中のもの
let undoStack = [], redoStack = [];

function blank() {
  return { version: 1, id: null, draftId: 'd' + Date.now().toString(36), title: '', image: null, imgW: 0, imgH: 0, scale: null, ceiling: 2.4, walls: [], openings: [], rooms: [], items: [], start: null };
}
const snapshot = () => JSON.stringify({ ...plan, image: undefined });
function commit() {
  undoStack.push(lastSnap); if (undoStack.length > 120) undoStack.shift();
  redoStack = []; lastSnap = snapshot(); scheduleSave(); refreshUI();
}
let lastSnap = '';
function restore(snap) { const im = plan.image; plan = JSON.parse(snap); plan.image = im; lastSnap = snap; sel = null; scheduleSave(); refreshUI(); }
$('undo').onclick = () => { if (!undoStack.length) return; redoStack.push(lastSnap); restore(undoStack.pop()); };
$('redo').onclick = () => { if (!redoStack.length) return; undoStack.push(lastSnap); restore(redoStack.pop()); };

// ---------------- 保存（このブラウザ） ----------------
const DRAFTS_KEY = 'fp3d-drafts';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let saveT = null;
function scheduleSave() { $('saveState').textContent = '保存しています…'; clearTimeout(saveT); saveT = setTimeout(saveDraft, 700); }
function saveDraft() {
  if (!plan) return;
  const ok = store.set('fp3d-draft-' + plan.draftId, JSON.stringify(plan));
  const list = JSON.parse(store.get(DRAFTS_KEY) || '[]').filter(d => d.id !== plan.draftId);
  list.unshift({ id: plan.draftId, title: plan.title || '名前なし', updated: Date.now() });
  store.set(DRAFTS_KEY, JSON.stringify(list.slice(0, 20)));
  $('saveState').textContent = ok ? 'このブラウザに保存済み' : '保存できませんでした（容量不足）。「ファイル」から書き出してください';
}

// ---------------- 画像の読み込み ----------------
function loadImageFile(file, cb) {
  if (!file || !file.type.startsWith('image/')) { toast('画像ファイルを選んでください'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const MAX = 1800, k = Math.min(1, MAX / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.9), c.width, c.height, k);
    };
    im.onerror = () => toast('画像を読み込めませんでした');
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function setImage(dataUrl, then) {
  img = new Image();
  img.onload = () => { then && then(); fit(); draw(); };
  img.src = dataUrl;
}
function startNew(dataUrl, w, h) {
  plan = blank(); plan.image = dataUrl; plan.imgW = w; plan.imgH = h;
  undoStack = []; redoStack = []; lastSnap = snapshot(); sel = null;
  $('title').value = '';
  setImage(dataUrl); hideStart(); setTool('scale'); scheduleSave(); refreshUI();
}
function openPlan(p) {
  plan = Object.assign(blank(), p);
  if (!plan.draftId) plan.draftId = 'd' + Date.now().toString(36);
  undoStack = []; redoStack = []; lastSnap = snapshot(); sel = null;
  $('title').value = plan.title || '';
  setImage(plan.image); hideStart(); setTool(plan.scale ? 'select' : 'scale'); refreshUI();
}
$('imgFile').onchange = e => { loadImageFile(e.target.files[0], startNew); e.target.value = ''; };
$('imgFile2').onchange = e => {
  loadImageFile(e.target.files[0], (url, w, h) => {
    const k = plan.imgW ? w / plan.imgW : 1;
    if (Math.abs(k - 1) > 0.01) scalePlan(k);
    plan.image = url; plan.imgW = w; plan.imgH = h; setImage(url); commit(); toast('画像を差し替えました');
  });
  e.target.value = '';
};
function scalePlan(k) {
  plan.walls.forEach(w => { w.a = w.a.map(v => v * k); w.b = w.b.map(v => v * k); });
  plan.rooms.concat(plan.items).forEach(r => { r.x1 *= k; r.y1 *= k; r.x2 *= k; r.y2 *= k; });
  if (plan.start) { plan.start.x *= k; plan.start.y *= k; }
  if (plan.scale) plan.scale /= k;
}
const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); loadImageFile(e.dataTransfer.files[0], startNew); });

// ---------------- 開始画面・ファイル ----------------
function showStart() {
  const list = JSON.parse(store.get(DRAFTS_KEY) || '[]');
  const wrap = $('drafts'); wrap.textContent = '';
  list.forEach(d => {
    const row = document.createElement('div'); row.className = 'item';
    const name = document.createElement('span'); name.textContent = `${d.title}（${new Date(d.updated).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}）`;
    const open = document.createElement('button'); open.textContent = '続ける';
    open.onclick = () => { const raw = store.get('fp3d-draft-' + d.id); if (raw) openPlan(JSON.parse(raw)); else toast('保存データが見つかりません'); };
    const del = document.createElement('button'); del.textContent = '削除'; del.className = 'danger';
    del.onclick = () => {
      if (del.dataset.confirm) {
        store.del('fp3d-draft-' + d.id);
        store.set(DRAFTS_KEY, JSON.stringify(JSON.parse(store.get(DRAFTS_KEY) || '[]').filter(x => x.id !== d.id)));
        showStart();
      } else { del.dataset.confirm = 1; del.textContent = '本当に削除'; }
    };
    row.append(name, open, del); wrap.appendChild(row);
  });
  $('draftsWrap').hidden = !list.length;
  $('startScreen').hidden = false;
}
function hideStart() { $('startScreen').hidden = true; }
$('importBtn').onclick = $('importBtn2').onclick = () => $('jsonFile').click();
$('jsonFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const p = JSON.parse(fr.result);

    if (!token) { pubMsg('アクセストークンを入れてください', 'err'); return; }
  }
  $('pubGo').disabled = true; pubMsg('権限を確認しています…', 'ok');
  try {
    const repo = await gh(token, '');
    if (repo.status === 401) { try { sessionStorage.removeItem(TOKEN_KEY); localStorage.removeItem(TOKEN_KEY); } catch (e) {} $('pubTokenWrap').hidden = false; throw new Error('トークンが正しくないか、有効期限が切れています。入れ直してください。'); }
    if (!repo.ok) throw new Error('リポジトリを確認できませんでした（' + repo.status + '）。');
    const p = repo.body.permissions || {};
    if (!(p.push || p.admin || p.maintain)) throw new Error('このトークンの持ち主には、サイトへの書き込み権限がありません。');
    if (!$('pubTokenWrap').hidden) tokenStore.set(token, $('pubRemember').checked);

    plan.title = title; plan.summary = $('pubSummary').value.trim(); $('title').value = title;
    const id = plan.id || ('p' + Date.now().toString(36));
    pubMsg('ファイルを送っています…', 'ok');
    const catalog = await readJson(token, 'catalog.json', []);
    const access = await readJson(token, 'access.json', {});
    const now = new Date().toISOString();
    const entry = { id, title, summary: plan.summary, rooms: plan.rooms.filter(r => r.name).map(r => r.name + (r.jo ? ` ${r.jo}帖` : '')), updatedAt: now };
    const idx = catalog.findIndex(c => c.id === id);
    if (idx >= 0) catalog[idx] = entry; else catalog.push(entry);
    if (!(id in access)) access[id] = true;
    const pub = { ...plan, id, image: `plans/${id}.jpg`, draftId: undefined, updatedAt: now };
    const files = [
      { path: `plans/${id}.json`, content: b64utf8(JSON.stringify(pub)) },
      { path: `plans/${id}.jpg`, content: plan.image.split(',')[1] },
      { path: 'catalog.json', content: b64utf8(JSON.stringify(catalog, null, 2) + '\n') },
      { path: 'access.json', content: b64utf8(JSON.stringify(access, null, 2) + '\n') },
    ];
    for (let attempt = 0; attempt < 2; attempt++) {
      const ref = await gh(token, `/git/ref/heads/${BRANCH}`); if (!ref.ok) throw new Error('ref ' + ref.status);
      const base = ref.body.object.sha;
      const commitInfo = await gh(token, `/git/commits/${base}`); if (!commitInfo.ok) throw new Error('commit ' + commitInfo.status);
      const tree = [];
      for (const f of files) {
        const b = await gh(token, '/git/blobs', { method: 'POST', body: JSON.stringify({ content: f.content, encoding: 'base64' }) });
        if (!b.ok) throw new Error(b.status === 403 || b.status === 404 ? 'write' : 'blob ' + b.status);
        tree.push({ path: f.path, mode: '100644', type: 'blob', sha: b.body.sha });
      }
      const t = await gh(token, '/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: commitInfo.body.tree.sha, tree }) });
      if (!t.ok) throw new Error('tree ' + t.status);
      const c = await gh(token, '/git/commits', { method: 'POST', body: JSON.stringify({ message: `間取りを公開: ${title}`, tree: t.body.sha, parents: [base] }) });
      if (!c.ok) throw new Error('commit ' + c.status);
      const u = await gh(token, `/git/refs/heads/${BRANCH}`, { method: 'PATCH', body: JSON.stringify({ sha: c.body.sha }) });
      if (u.ok) break;
      if (attempt === 1) throw new Error('ほかの変更と重なったため保存できませんでした。もう一度「公開する」を押してください。');
    }
    plan.id = id; commit();
    const url = new URL(`view.html?id=${id}`, location.href).href;
    const m = $('pubMsg'); m.className = 'msg ok'; m.hidden = false; m.textContent = '公開しました。1〜2分でサイトに反映されます。アドレス：';
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = url; m.append(a);
  } catch (err) {
    const t = String(err.message || err);
    pubMsg(t === 'write' ? '書き込みが許可されませんでした。トークンの Contents 権限が「Read and write」か確認してください。'
      : /^(ref|commit|tree|blob|read)/.test(t) ? '公開できませんでした（' + t + '）。時間をおいてもう一度お試しください。' : t, 'err');
  } finally { $('pubGo').disabled = false; }
};

// ---------------- その他 ----------------
let toastT;
function toast(t) { const e = $('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => e.style.opacity = 0, 2600); }
new ResizeObserver(resize).observe($('stage'));

// 起動：?id= なら公開済みの間取りを編集、なければ開始画面
(async () => {
  resize();
  const id = new URLSearchParams(location.search).get('id');
  if (id && /^[a-z0-9-]+$/i.test(id)) {
    try {
      const r = await fetch(`plans/${id}.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!r.ok) throw new Error();
      const p = await r.json();
      const ir = await fetch(`${p.image}?t=${Date.now()}`, { cache: 'no-store' });
      const blob = await ir.blob();
      p.image = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
      openPlan(p); toast('公開中の間取りを開きました。直して「サイトに公開」で上書きできます');
      return;
    } catch (e) { toast('公開中の間取りを読み込めませんでした'); }
  }
  showStart();
})();
})();
</script>
